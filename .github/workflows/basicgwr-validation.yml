name: basicgwr-validation

on:
  push:
    branches: [main]
    paths:
      - "src/georegime_gwr/gwr.py"
      - "src/georegime_gwr/bandwidth.py"
      - "experiments/validation/basicgwr_vs_mgwr_georgia.py"
      - "experiments/spatial/build_georgia_queen_w.py"
      - "experiments/spatial/plot_georgia_spatial_structure.py"
      - "experiments/spatial/analyze_georgia_local_relationship_edges.py"
      - "experiments/spatial/plot_georgia_initial_ward_regimes.py"
      - "experiments/spatial/inspect_georgia_k6_initial_regimes.py"
      - "experiments/real_data/georgia_gwr_baseline/plot_variable_spatial_distributions.py"
      - "experiments/real_data/georgia_gwr_baseline/plot_basicgwr_local_coefficients.py"
      - "experiments/real_data/georgia_gwr_baseline/run_georgia_k6_regime_restricted_gwr.py"
      - "experiments/real_data/georgia_gwr_baseline/compare_georgia_k6_gwr_vs_regime_ols.py"
      - "experiments/real_data/georgia_gwr_baseline/compare_georgia_mgwr_benchmark.py"
      - "data/raw/georgia/**"
      - ".github/workflows/basicgwr-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy==1.26.4" \
            "scipy==1.11.4" \
            "pandas==2.2.3" \
            "matplotlib==3.8.4" \
            "scikit-learn==1.3.2" \
            "libpysal==4.10.0" \
            "mgwr==2.2.1"

      - name: Validate BasicGWR end to end
        run: python experiments/validation/basicgwr_vs_mgwr_georgia.py

      - name: Build Georgia Queen adjacency
        run: python experiments/spatial/build_georgia_queen_w.py

      - name: Plot Georgia spatial structure
        run: python experiments/spatial/plot_georgia_spatial_structure.py

      - name: Plot Georgia baseline variable spatial distributions
        run: python experiments/real_data/georgia_gwr_baseline/plot_variable_spatial_distributions.py

      - name: Plot Georgia BasicGWR local coefficients
        run: python experiments/real_data/georgia_gwr_baseline/plot_basicgwr_local_coefficients.py

      - name: Analyze Georgia local relationship edges
        run: python experiments/spatial/analyze_georgia_local_relationship_edges.py

      - name: Plot Georgia initial Queen-constrained Ward regimes
        run: python experiments/spatial/plot_georgia_initial_ward_regimes.py

      - name: Inspect exploratory Georgia K6 partition
        run: python experiments/spatial/inspect_georgia_k6_initial_regimes.py

      - name: Run exploratory K6 regime-restricted GWR
        run: python experiments/real_data/georgia_gwr_baseline/run_georgia_k6_regime_restricted_gwr.py

      - name: Compare K6 GWR with regime OLS
        run: python experiments/real_data/georgia_gwr_baseline/compare_georgia_k6_gwr_vs_regime_ols.py

      - name: Compare external MGWR benchmark
        run: python experiments/real_data/georgia_gwr_baseline/compare_georgia_mgwr_benchmark.py

      - name: Show validation summary
        run: |
          cat results/validation/basicgwr_vs_mgwr_georgia/README.md
          cat results/spatial/georgia_queen_w/summary.json
          cat results/spatial/georgia_local_relationship_edges/summary.json
          cat results/spatial/georgia_initial_ward_regimes/summary.json
          cat results/spatial/georgia_initial_ward_regimes/ward_partition_diagnostics.csv
          cat results/spatial/georgia_initial_ward_regimes/k6_focus/summary.json
          cat results/spatial/georgia_initial_ward_regimes/k6_focus/k6_regime_summary.csv
          cat results/real_data/georgia_k6_regime_restricted_gwr/summary.json
          cat results/real_data/georgia_k6_regime_restricted_gwr/regime_gwr_summary.csv
          cat results/real_data/georgia_k6_regime_restricted_gwr/model_comparison.csv
          cat results/real_data/georgia_k6_model_form_comparison/summary.json
          cat results/real_data/georgia_k6_model_form_comparison/model_comparison.csv
          cat results/real_data/georgia_k6_model_form_comparison/per_regime_comparison.csv
          cat results/real_data/georgia_mgwr_benchmark/summary.json
          cat results/real_data/georgia_mgwr_benchmark/model_comparison.csv
          cat results/real_data/georgia_mgwr_benchmark/mgwr_bandwidths.csv
          ls -lh results/spatial/georgia_queen_w/*.png results/spatial/georgia_queen_w/*.svg
          ls -lh results/spatial/georgia_local_relationship_edges/*.png results/spatial/georgia_local_relationship_edges/*.svg
          ls -lh results/spatial/georgia_initial_ward_regimes/*.png results/spatial/georgia_initial_ward_regimes/*.svg
          ls -lh results/spatial/georgia_initial_ward_regimes/k6_focus/*.png results/spatial/georgia_initial_ward_regimes/k6_focus/*.svg
          ls -lh results/real_data/georgia_gwr_baseline/*.png results/real_data/georgia_gwr_baseline/*.svg
          ls -lh results/real_data/georgia_k6_regime_restricted_gwr/*.png results/real_data/georgia_k6_regime_restricted_gwr/*.svg
          cat results/real_data/georgia_gwr_baseline/basicgwr_local_coefficients_summary.csv

      - name: Persist validation outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            results/validation/basicgwr_vs_mgwr_georgia \
            results/spatial/georgia_queen_w \
            results/spatial/georgia_local_relationship_edges \
            results/spatial/georgia_initial_ward_regimes \
            results/real_data/georgia_gwr_baseline \
            results/real_data/georgia_k6_regime_restricted_gwr \
            results/real_data/georgia_k6_model_form_comparison \
            results/real_data/georgia_mgwr_benchmark
          if git diff --cached --quiet; then
            echo "No validation changes to commit."
          else
            git commit -m "test: store GWR validation and Georgia spatial outputs [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push attempt ${attempt} failed; retrying after refresh..."
              sleep 3
            done
            echo "Failed to persist validation outputs after 3 attempts."
            exit 1
          fi
