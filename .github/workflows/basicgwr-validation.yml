name: basicgwr-validation

on:
  push:
    branches: [main]
    paths:
      - "src/georegime_gwr/gwr.py"
      - "src/georegime_gwr/bandwidth.py"
      - "experiments/validation/basicgwr_vs_mgwr_georgia.py"
      - "experiments/spatial/build_georgia_queen_w.py"
      - "experiments/spatial/plot_georgia_spatial_structure.py"
      - "experiments/real_data/georgia_gwr_baseline/plot_variable_spatial_distributions.py"
      - "data/raw/georgia/**"
      - ".github/workflows/basicgwr-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy==1.26.4" \
            "scipy==1.11.4" \
            "pandas==2.2.3" \
            "matplotlib==3.8.4" \
            "libpysal==4.10.0" \
            "mgwr==2.2.1"

      - name: Validate BasicGWR end to end
        run: python experiments/validation/basicgwr_vs_mgwr_georgia.py

      - name: Build Georgia Queen adjacency
        run: python experiments/spatial/build_georgia_queen_w.py

      - name: Plot Georgia spatial structure
        run: python experiments/spatial/plot_georgia_spatial_structure.py

      - name: Plot Georgia baseline variable spatial distributions
        run: python experiments/real_data/georgia_gwr_baseline/plot_variable_spatial_distributions.py

      - name: Show validation summary
        run: |
          cat results/validation/basicgwr_vs_mgwr_georgia/README.md
          cat results/spatial/georgia_queen_w/summary.json
          ls -lh results/spatial/georgia_queen_w/*.png results/spatial/georgia_queen_w/*.svg
          ls -lh results/real_data/georgia_gwr_baseline/*.png results/real_data/georgia_gwr_baseline/*.svg

      - name: Persist validation outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            results/validation/basicgwr_vs_mgwr_georgia \
            results/spatial/georgia_queen_w \
            results/real_data/georgia_gwr_baseline
          if git diff --cached --quiet; then
            echo "No validation changes to commit."
          else
            git commit -m "test: store GWR validation and Georgia spatial outputs [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push attempt ${attempt} failed; retrying after refresh..."
              sleep 3
            done
            echo "Failed to persist validation outputs after 3 attempts."
            exit 1
          fi
