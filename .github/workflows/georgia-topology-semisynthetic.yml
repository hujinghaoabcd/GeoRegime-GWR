name: georgia-topology-semisynthetic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/georgia-topology-semisynthetic.yml"
      - "experiments/synthetic/run_georgia_topology_semisynthetic.py"
      - "experiments/synthetic/run_canonical_regime_boundary_simulation.py"
      - "src/georegime_gwr/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "scipy==1.11.4" "pandas==2.2.3" "matplotlib==3.9.4" "scikit-learn==1.5.2" "mgwr==2.2.1" "geopandas==1.0.1" "pyogrio==0.10.0"
      - name: Run Georgia-topology semi-synthetic simulation
        run: python experiments/synthetic/run_georgia_topology_semisynthetic.py
      - name: Show key results
        run: |
          cat results/synthetic/georgia_topology_semisynthetic/summary.json
          cat results/synthetic/georgia_topology_semisynthetic/boundary_recovery.csv
          cat results/synthetic/georgia_topology_semisynthetic/model_recovery_metrics.csv
      - name: Persist outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/synthetic/georgia_topology_semisynthetic
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "test: store Georgia-topology semi-synthetic results [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
