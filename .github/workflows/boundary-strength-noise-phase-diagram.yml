name: boundary-strength-noise-phase-diagram

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/boundary-strength-noise-phase-diagram.yml"
      - "experiments/synthetic/run_boundary_strength_noise_phase_diagram.py"
      - "experiments/synthetic/run_canonical_regime_boundary_simulation.py"
      - "src/georegime_gwr/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "scipy==1.11.4" "pandas==2.2.3" "matplotlib==3.9.4" "scikit-learn==1.5.2" "mgwr==2.2.1"

      - name: Run phase diagram
        run: python experiments/synthetic/run_boundary_strength_noise_phase_diagram.py

      - name: Show summary
        run: |
          cat results/synthetic/boundary_strength_noise_phase_diagram/summary.json
          cat results/synthetic/boundary_strength_noise_phase_diagram/phase_diagram_results.csv

      - name: Persist outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/synthetic/boundary_strength_noise_phase_diagram
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "test: store boundary-strength noise phase diagram [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 3
            done
            exit 1
          fi
