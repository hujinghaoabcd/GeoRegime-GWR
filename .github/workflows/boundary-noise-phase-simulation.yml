name: boundary-noise-phase-simulation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/boundary-noise-phase-simulation.yml"
      - "experiments/synthetic/run_boundary_noise_phase_scenario.py"
      - "experiments/synthetic/aggregate_boundary_noise_phase.py"
      - "src/georegime_gwr/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.10"

jobs:
  scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        delta: [0, 0.5, 1.0, 1.5, 2.0]
        noise: [0.5, 0.75, 1.0, 1.5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "scipy==1.11.4" "pandas==2.2.3" "matplotlib==3.9.4" "scikit-learn==1.5.2" "mgwr==2.2.1"
      - name: Run phase cell
        run: |
          python experiments/synthetic/run_boundary_noise_phase_scenario.py \
            --delta "${{ matrix.delta }}" \
            --noise "${{ matrix.noise }}" \
            --seed 20260903 \
            --output scenario_output
      - uses: actions/upload-artifact@v4
        with:
          name: phase-d${{ matrix.delta }}-n${{ matrix.noise }}
          path: scenario_output/scenario_*.json
          if-no-files-found: error

  aggregate:
    needs: scenario
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install aggregation environment
        run: python -m pip install "numpy==1.26.4" "pandas==2.2.3" "matplotlib==3.9.4"
      - uses: actions/download-artifact@v4
        with:
          pattern: phase-*
          path: phase_inputs
          merge-multiple: true
      - name: Aggregate phase diagram
        run: |
          python experiments/synthetic/aggregate_boundary_noise_phase.py \
            --input phase_inputs \
            --output results/synthetic/boundary_noise_phase
          cat results/synthetic/boundary_noise_phase/summary.json
          cat results/synthetic/boundary_noise_phase/summary_by_delta.csv
          cat results/synthetic/boundary_noise_phase/summary_by_noise.csv
      - name: Persist outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/synthetic/boundary_noise_phase
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "test: store boundary-noise phase results [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
