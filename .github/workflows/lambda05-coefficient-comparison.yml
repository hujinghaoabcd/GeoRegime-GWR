name: lambda05-coefficient-comparison

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lambda05-coefficient-comparison.yml"
      - "experiments/real_data/georgia_gwr_baseline/compare_georgia_lambda05_coefficients.py"
      - "src/georegime_gwr/**"
      - "data/raw/georgia/**"
      - "results/real_data/georgia_k6_lambda_sensitivity/lambda_final_labels.csv"
      - "results/real_data/georgia_mgwr_benchmark/mgwr_county_results.csv"
      - "results/spatial/georgia_queen_w/edge_list.csv"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "scipy==1.11.4" "pandas==2.2.3" "scikit-learn==1.3.2"

      - name: Compare local coefficients
        run: python experiments/real_data/georgia_gwr_baseline/compare_georgia_lambda05_coefficients.py

      - name: Show summaries
        run: |
          cat results/real_data/georgia_lambda05_coefficient_comparison/summary.json
          cat results/real_data/georgia_lambda05_coefficient_comparison/coefficient_pair_summary.csv
          cat results/real_data/georgia_lambda05_coefficient_comparison/boundary_residual_summary.csv
          cat results/real_data/georgia_lambda05_coefficient_comparison/coefficient_boundary_difference.csv

      - name: Persist outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/real_data/georgia_lambda05_coefficient_comparison
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "test: store lambda05 coefficient comparison [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 3
            done
            exit 1
          fi
