name: k6-refinement-visualization

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/k6-refinement-visualization.yml"
      - "experiments/spatial/plot_georgia_k6_refinement_changes.py"
      - "experiments/real_data/georgia_gwr_baseline/analyze_georgia_k6_refinement_drivers.py"
      - "results/real_data/georgia_k6_unified_label_refinement/final_county_results.csv"
      - "results/real_data/georgia_k6_unified_label_refinement/accepted_label_moves.csv"
      - "results/real_data/georgia_k6_unified_label_refinement/changed_counties.csv"
      - "results/real_data/georgia_k6_unified_label_refinement/label_path.csv"
      - "data/raw/georgia/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visualize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install plotting environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "pandas==2.2.3" "matplotlib==3.8.4" "geopandas==0.14.4"

      - name: Plot K6 refinement changes
        run: python experiments/spatial/plot_georgia_k6_refinement_changes.py

      - name: Analyze K6 refinement drivers
        run: python experiments/real_data/georgia_gwr_baseline/analyze_georgia_k6_refinement_drivers.py

      - name: Show change summary
        run: |
          cat results/real_data/georgia_k6_unified_label_refinement/label_change_summary.json
          cat results/real_data/georgia_k6_unified_label_refinement/changed_transition_summary.csv
          cat results/real_data/georgia_k6_unified_label_refinement/regime_size_change.csv
          cat results/real_data/georgia_k6_unified_label_refinement/refinement_driver_summary.json
          cat results/real_data/georgia_k6_unified_label_refinement/r3_to_r4_driver_detail.csv

      - name: Persist visualization outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/real_data/georgia_k6_unified_label_refinement
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "test: store K6 refinement diagnostics [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
