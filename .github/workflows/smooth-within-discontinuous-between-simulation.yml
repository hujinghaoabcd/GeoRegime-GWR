name: smooth-within-discontinuous-between-simulation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/smooth-within-discontinuous-between-simulation.yml"
      - "experiments/synthetic/run_smooth_within_discontinuous_between_simulation.py"
      - "experiments/synthetic/run_canonical_regime_boundary_simulation.py"
      - "src/georegime_gwr/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "scipy==1.11.4" "pandas==2.2.3" "matplotlib==3.9.4" "scikit-learn==1.5.2" "mgwr==2.2.1"

      - name: Run smooth-within discontinuous-between simulation
        run: python experiments/synthetic/run_smooth_within_discontinuous_between_simulation.py

      - name: Show key tables
        run: |
          cat results/synthetic/smooth_within_discontinuous_between/summary.json
          cat results/synthetic/smooth_within_discontinuous_between/boundary_recovery.csv
          cat results/synthetic/smooth_within_discontinuous_between/coefficient_recovery.csv
          cat results/synthetic/smooth_within_discontinuous_between/true_boundary_jump_recovery.csv
          cat results/synthetic/smooth_within_discontinuous_between/within_regime_gradient_recovery.csv

      - name: Persist outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/synthetic/smooth_within_discontinuous_between
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "test: store smooth-within discontinuous-between simulation [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 3
            done
            exit 1
          fi
