name: georgia-gwr-reproduction

on:
  push:
    branches: [main]
    paths:
      - "experiments/real_data/georgia_gwr_baseline/**"
      - ".github/workflows/georgia-gwr-reproduction.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pinned GWR reproduction environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy==1.26.4" \
            "scipy==1.11.4" \
            "pandas==2.2.3" \
            "libpysal==4.10.0" \
            "mgwr==2.2.1"

      - name: Reproduce Georgia standard GWR
        run: |
          python experiments/real_data/georgia_gwr_baseline/reproduce.py --vendor-data

      - name: Show result summary
        run: cat results/reproduction/georgia_gwr_baseline/README.md

      - name: Persist canonical data and GWR outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/georgia
          git add -f results/reproduction/georgia_gwr_baseline
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "data: store Georgia standard-GWR baseline [skip ci]"
            git push
          fi
